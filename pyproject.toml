[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-firewall-research"
version = "0.1.0"
description = "Reproducible offline flow classification and budget-constrained firewall policy research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.7", "scipy>=1.12", "matplotlib>=3.8", "joblib>=1.4", "threadpoolctl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
firewall-study = "adaptive_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
